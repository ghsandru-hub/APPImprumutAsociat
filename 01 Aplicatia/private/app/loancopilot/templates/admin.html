<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Administrare · LoanCopilot</title><link rel="stylesheet" href="{{ url_for('static',filename='auth.css') }}"></head><body><main class="layout"><header class="topbar"><div><h1>Administrare LoanCopilot</h1><div class="note">Companii, utilizatori și roluri</div></div><a href="/">← Înapoi în aplicație</a></header><div class="grid">{% if user.is_superadmin %}<section class="card"><h2>Companie nouă</h2><div class="pad"><form id="companyForm"><div class="field"><label>Denumire</label><input id="companyName" required></div><div class="field"><label>CUI</label><input id="companyCui" required></div><div class="field"><label>Slug folder/bază</label><input id="companySlug" placeholder="ex. companie-cui"></div><div class="field"><label>Nr. Registrul Comerțului</label><input id="companyReg"></div><div class="field"><label>Sediu</label><input id="companyAddress"></div><div class="field"><label>Administrator</label><input id="companyAdministrator"></div><button class="btn primary">Creează compania și baza SQLite</button></form></div></section>{% endif %}<section class="card"><h2>Utilizator nou / atribuire</h2><div class="pad"><form id="userForm"><div class="field"><label>Nume afișat</label><input id="userName" required></div><div class="field"><label>Email</label><input id="userEmail" type="email" required></div><div class="field"><label>Parolă inițială</label><input id="userPassword" type="password" minlength="12" required></div><div class="field"><label>Companie</label><select id="userCompany"></select></div><div class="field"><label>Rol</label><select id="userRole"><option>VIEWER</option><option>EDITOR</option><option>ADMIN</option></select></div><button class="btn primary">Salvează utilizatorul</button></form></div></section></div><section class="card" style="margin-top:16px"><h2>Companii</h2><div class="tablewrap"><table class="data"><thead><tr><th>Denumire</th><th>CUI</th><th>DB</th><th>Documente</th><th>Activă</th></tr></thead><tbody id="companiesBody"></tbody></table></div></section><section class="card" style="margin-top:16px"><h2>Utilizatori și acces</h2><div class="tablewrap"><table class="data"><thead><tr><th>Utilizator</th><th>2FA</th><th>Ultima autentificare</th><th>Acces</th><th>Status</th></tr></thead><tbody id="usersBody"></tbody></table></div></section></main><div class="toast" id="toast"></div><script>
const csrf=document.querySelector('meta[name="csrf-token"]').content;let state={};async function api(url,opt={}){const method=(opt.method||'GET').toUpperCase();const headers={'Content-Type':'application/json',...(opt.headers||{})};if(method!=='GET')headers['X-CSRF-Token']=csrf;const r=await fetch(url,{credentials:'same-origin',headers,...opt});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||'Eroare');return d}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(m,b=false){const e=document.getElementById('toast');e.textContent=m;e.style.background=b?'#a53f3f':'#17202a';e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2800)}async function load(){state=await api('/api/admin/data');userCompany.innerHTML=state.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');companiesBody.innerHTML=state.companies.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="note">${esc(c.slug)}</div></td><td>${esc(c.cui)}</td><td class="mono">${esc(c.db_filename)}</td><td class="mono">${esc(c.documents_subdir)}</td><td><span class="pill ${c.active?'ok':''}">${c.active?'DA':'NU'}</span></td></tr>`).join('');usersBody.innerHTML=state.users.map(u=>{const m=state.memberships.filter(x=>x.user_id===u.id).map(x=>`${esc(x.company_name)} · <b>${esc(x.role)}</b>`).join('<br>')||'—';return `<tr><td><b>${esc(u.display_name)}</b><div class="note">${esc(u.email)}</div></td><td>${u.totp_enabled?'activ':'inactiv'}</td><td>${esc(u.last_login_at||'—')}</td><td>${m}</td><td>{% if user.is_superadmin %}<button class="btn" onclick="toggleUser(${u.id},${u.active?0:1})">${u.active?'Dezactivează':'Activează'}</button>{% else %}<span class="pill ${u.active?'ok':''}">${u.active?'ACTIV':'INACTIV'}</span>{% endif %}</td></tr>`}).join('')}
companyForm?.addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/api/admin/companies',{method:'POST',body:JSON.stringify({name:companyName.value,cui:companyCui.value,slug:companySlug.value,reg_com:companyReg.value,address:companyAddress.value,administrator:companyAdministrator.value})});e.target.reset();await load();toast(`Compania, baza SQLite și ${d.templates_copied||0} șabloane au fost create`)}catch(x){toast(x.message,true)}});userForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({display_name:userName.value,email:userEmail.value,password:userPassword.value,company_id:Number(userCompany.value),role:userRole.value})});e.target.reset();await load();toast('Utilizatorul a fost salvat')}catch(x){toast(x.message,true)}});async function toggleUser(id,active){try{await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({active})});await load();toast('Status actualizat')}catch(x){toast(x.message,true)}}load().catch(x=>toast(x.message,true));
</script></body></html>
