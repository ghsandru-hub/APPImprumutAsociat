<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autentificare · LoanCopilot</title><link rel="stylesheet" href="{{ url_for('static',filename='auth.css') }}"></head><body><main class="shell"><section class="authcard"><header class="head"><div class="logo">LC</div><div><h1>LoanCopilot</h1><p>Împrumuturi asociați · acces securizat</p></div></header><div class="body">{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" autocomplete="on"><div class="field"><label>Email</label><input type="email" name="email" required autocomplete="username" autofocus></div><div class="field"><label>Parolă</label><input type="password" name="password" required autocomplete="current-password"></div><button class="btn primary" type="submit">Autentificare</button></form><p class="note">Accesul este limitat la companiile și rolurile atribuite contului. Autentificarea cu doi factori poate fi activată individual.</p></div><footer class="footer">smartBIZ LoanCopilot · v{{ version }}</footer></section></main></body></html>
